<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Management</title>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:30px auto;padding:0 16px;background:#f5f7fa;color:#222}
h1{color:#0b5ed7}form{display:flex;gap:8px;margin-bottom:16px}input{flex:1;padding:8px}
button{padding:8px 12px;background:#0b5ed7;color:#fff;border:0;border-radius:4px;cursor:pointer}
li{background:#fff;margin:6px 0;padding:10px;border-radius:6px;display:flex;justify-content:space-between}
ul{padding:0;list-style:none}
</style></head><body>
<h1>🎓 Student Management</h1>
<form id="f"><input id="name" placeholder="Name" required><input id="course" placeholder="Course" required><button>Add</button></form>
<ul id="list"></ul>
<script>
const list=document.getElementById('list'),f=document.getElementById('f');
async function load(){const r=await fetch('/api/students');const d=await r.json();
list.innerHTML=d.map(s=>`<li><span>${s.name} — ${s.course}</span><button onclick="del(${s.id})">Delete</button></li>`).join('')}
async function del(id){await fetch('/api/students/'+id,{method:'DELETE'});load()}
f.onsubmit=async e=>{e.preventDefault();
await fetch('/api/students',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name.value,course:f.course.value})});
f.reset();load()};
load();
</script></body></html>
